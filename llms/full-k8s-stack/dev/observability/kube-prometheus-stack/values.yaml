prometheus:
  prometheusSpec:
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp2
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi
    serviceMonitorSelectorNilUsesHelmValues: false

grafana:
  adminPassword: admin
  sidecar:
    dashboards:
      enabled: true
    datasources:
      enabled: true
  # Exposed through the shared nginx ingress, same pattern as bifrost/litellm.
  # grafana-tls is a self-signed cert created out-of-band (see CONFIGURATION.md);
  # there is no cert-manager in this cluster.
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - grafana.poolsi.de
    path: /
    pathType: Prefix
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.poolsi.de

alertmanager:
  enabled: true

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true
