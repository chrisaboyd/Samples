apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: observability

# Only services that actually expose a Prometheus endpoint belong here. A ServiceMonitor
# aimed at a non-existent endpoint produces a permanently down target, not "no data".
# LiteLLM and Langfuse are deliberately absent -- see CONFIGURATION.md.
resources:
  - manifests/bifrost-servicemonitor.yaml
  - manifests/vllm-servicemonitor.yaml
  - manifests/dcgm-servicemonitor.yaml
