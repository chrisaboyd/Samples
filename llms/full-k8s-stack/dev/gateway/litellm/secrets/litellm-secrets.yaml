apiVersion: v1
kind: Secret
metadata:
  name: litellm-secrets
  namespace: gateway
type: Opaque
stringData:
  # Master key clients use as the LiteLLM API key (Bearer token). Format: sk-...
  master-key: "sk-litellm-master-key-change-me"
  # Langfuse project API keys used by LiteLLM to push traces.
  # MUST match observability/langfuse/secrets/langfuse-secrets.yaml.
  langfuse-public-key: "pk-lf-dev-0000000000000000"
  langfuse-secret-key: "sk-lf-dev-0000000000000000"
