# Run 2 of 2: the agentic profile, where KV cache becomes the binding constraint.
#
# This is the run that finally exercises the PRD's headline objective. At a 50,000
# token budget the arithmetic flips:
#
#   GPU KV cache size: 1,184,878 tokens (engine startup log)
#     at  4,080 tokens/session -> 290 sessions  -> max_num_seqs=192 binds
#     at  6,170 tokens/session -> 192 sessions  -> the crossover
#     at 50,000 tokens/session ->  23 sessions  -> KV binds
#
# So no vLLM change is needed here. max_num_seqs=192 is already above what KV
# allows at this context length, which means KV exhaustion, recomputation, and
# preemption are reachable for the first time.
#
# max_model_len is 262,144, so the 15:1 shape (46,875 in + 3,125 out) fits with
# room to spare.
#
# The KV pool is pinned in tokens with BENCH_TOKEN_MAX, so the runner does the
# division itself and the ceiling follows the token budget. Auto-detection reads
# block_size x num_gpu_blocks from vllm:cache_config_info and gets 1,303,120,
# about 10% above what the engine reports, which would put the ceiling at 26.
#
# Six curve points: 1, 6, 12, 18, 23, 35. The overload level is 1.5x rather than
# 1.25x because at a ceiling this low, 1.25x rounds to 29 and sits too close to
# the limit to produce unambiguous preemption.
apiVersion: batch/v1
kind: Job
metadata:
  generateName: vllm-bench-agentic-50k-
  namespace: poolside-models
  labels:
    app.kubernetes.io/name: vllm-behavior-benchmark
    benchmark.poolside/profile: agentic-50k
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400
  # Requests are long here: the 1:5 shape generates 41,667 tokens, which is ~46s
  # single-stream and several minutes under KV pressure. Twelve tests at 420s plus
  # drain lands near two hours; six hours leaves headroom for the overload level
  # thrashing.
  activeDeadlineSeconds: 21600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vllm-behavior-benchmark
        benchmark.poolside/profile: agentic-50k
    spec:
      restartPolicy: Never
      containers:
        - name: benchmark
          image: 992382466748.dkr.ecr.us-east-2.amazonaws.com/vllm-benchmark_boyd:latest
          imagePullPolicy: Always
          env:
            - name: BENCH_VLLM_ENDPOINT
              value: http://inference-laguna-s.poolside-models.svc.cluster.local
            - name: BENCH_MODEL
              value: Laguna
            - name: BENCH_TOKEN_BUDGET
              value: "50000"
            # The engine's own "GPU KV cache size" line, not cache_config_info.
            # Concurrency is this divided by BENCH_TOKEN_BUDGET: 23 sessions.
            - name: BENCH_TOKEN_MAX
              value: "1184878"
            # baseline 1, then 12, 23, 35. The last one is past the KV ceiling.
            - name: BENCH_CONCURRENCY_LEVELS
              value: "1,0.5,1.0,1.5"
            # fills in 6 and 18
            - name: BENCH_SWEEP_LEVELS
              value: "0.25,0.75"
            - name: BENCH_TEST_DURATION_SECONDS
              value: "420"
            # Long ramp: at 17 concurrent sessions of 50k tokens the batch takes a
            # while to fill, and the steady window has to start after that.
            - name: BENCH_RAMP_SECONDS
              value: "60"
            # One request per worker is enough at this scale, and asking for more
            # would push several tests past an hour each.
            - name: BENCH_MIN_REQUESTS_PER_WORKER
              value: "1"
            - name: BENCH_TEST_MAX_SECONDS
              value: "1800"
            - name: BENCH_PROMETHEUS_URL
              value: http://kube-prometheus-stack-prometheus.observability.svc.cluster.local:9090
            - name: BENCH_METRIC_SELECTOR
              value: namespace="poolside-models",model_name="Laguna"
            - name: BENCH_PROMETHEUS_SETTLE_SECONDS
              value: "15"
            - name: BENCH_RESULTS_PATH
              value: /results/results.json
            - name: BENCH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: inference-api-key
                  key: VLLM_API_KEY
          resources:
            requests:
              cpu: "2"
              # 50k-token prompts are ~250KB of text each, and the factory holds
              # templates plus per-request copies in flight.
              memory: 2Gi
            limits:
              cpu: "8"
              memory: 6Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
          volumeMounts:
            - name: results
              mountPath: /results
            - name: tmp
              mountPath: /tmp
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      volumes:
        - name: results
          emptyDir: {}
        - name: tmp
          emptyDir: {}
