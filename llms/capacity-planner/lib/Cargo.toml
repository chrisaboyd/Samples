[package]
name = "capacity_planner"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Portable LLM capacity and performance calculator (PRD §31 Phase 1)."

[lib]
name = "capacity_planner"
path = "src/lib.rs"

[[bin]]
name = "capacity-planner"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
# compressed-tensors `ignore`/`targets` entries are `re:`-prefixed regexes; they
# select which tensors a checkpoint actually quantized (see `quant`).
regex = "1"
clap = { version = "4", features = ["derive"] }
# Optional network layer. The pure calculation core has no network dependency; the
# `sources` feature (HF URL fetch) is only enabled in the CLI binary.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "gzip", "rustls-tls"], optional = true }

[features]
default = []
sources = ["reqwest"]

[dev-dependencies]
serde_json = "1"
