name: Deploy DC2 Planner to Pages

on:
  push:
    branches: [main]
    paths:
      - "dc2_planner/**"
      - ".github/workflows/dc2-planner-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build data.js
        run: python dc2_planner/build_data.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dc2_planner
      - id: deployment
        uses: actions/deploy-pages@v4
